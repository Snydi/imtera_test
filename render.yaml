services:
  - type: web
    name: intera-test
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Imtera
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_LOCALE
        value: ru
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: intera-test-db
          property: connectionString
      - key: DB_SSLMODE
        value: prefer
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_QUEUE_RETRY_AFTER
        value: "660"
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SEED_USER_NAME
        value: imtera
      - key: SEED_USER_EMAIL
        value: imtera@example.com
      - key: SEED_USER_PASSWORD
        sync: false
      - key: YANDEX_MAPS_CONNECT_TIMEOUT
        value: "15"
      - key: YANDEX_MAPS_TIMEOUT
        value: "60"
      - key: YANDEX_MAPS_MAX_PAGES
        value: "100"
      - key: YANDEX_MAPS_PAGE_DELAY_MS
        value: "350"
      - key: YANDEX_MAPS_USER_AGENT
        value: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36

databases:
  - name: intera-test-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: intera
    user: intera
    ipAllowList: []
