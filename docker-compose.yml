name: imtera_test

x-app: &app
  image: ${COMPOSE_PROJECT_NAME:-imtera_test}-app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  working_dir: /var/www/html/backend
  env_file: .env
  volumes:
    - ./backend:/var/www/html/backend
    - vendor:/var/www/html/backend/vendor
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  app:
    <<: *app
    healthcheck:
      test: [ CMD-SHELL, "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong" ]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    <<: *app
    command: [ php, artisan, 'queue:work', '--sleep=3', '--tries=3', '--backoff=10', '--timeout=600' ]
    stop_grace_period: 610s
    healthcheck:
      test: [ CMD-SHELL, "grep -aq 'queue:work' /proc/1/cmdline" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run make env first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"' ]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    image: node:24.17.0-alpine
    profiles: [ tools ]
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    command: [ sh, -c, 'npm ci && npm run build' ]

  nginx:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8080}:80'
    volumes:
      - ./frontend/dist:/var/www/html/frontend/dist:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [ CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/up' ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  vendor:
  node_modules:
